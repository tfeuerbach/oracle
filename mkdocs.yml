site_name: Oracle
site_url: https://oracle.tfeuerbach.dev
site_description: A Discord bot that transcribes every video in your server and makes them searchable by what was said.
site_author: tfeuerbach

repo_name: tfeuerbach/oracle
repo_url: https://github.com/tfeuerbach/oracle

theme:
  name: material
  favicon: assets/favicon.png
  logo: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Commands: commands.md
  - URL Video Support: url-support.md
  - Self-Hosting: self-hosting.md
  - Architecture: architecture.md
  - Privacy Policy: privacy.md
  - Terms of Service: terms.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - assets/egg.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tfeuerbach/oracle
